<!doctype html>
<!-- TODO: get lang from table book data! -->
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="dark light" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>table charter</title>
        <!-- define favicon here:-->
        <link
            rel="icon"
            type="image/svg"
            href="/table_charter/assets/table_charter_favicon-D6sWoer5.svg"
        />
        <style>
            body {
                font-family: system-ui, sans-serif;
            }

            * {
                margin: 0px;
                padding: 0px;
            }

            img {
                height: 72%;
                margin-left: 7px;
                border: white solid 1px;
                border-radius: 4px;
            }
            #lang_select {
                margin-right: 15px;
                display: flex;
                gap: 5px;
            }

            /* see 2nd example here: https://stackoverflow.com/questions/25098042/fill-remaining-vertical-space-with-css-using-displayflex/25098486#25098486 */
            section {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            header {
                display: flex;
                flex-direction: row;
                justify-self: flex-start;
                justify-content: space-between;
                align-items: center;
                text-align: center;
                background: #5e677b;
                color: white;
                margin: 0px;
                font-size: 20px;
                width: 100%;
                height: 5%;
                min-height: 1.2em;
                max-height: 70px;
            }
            #title-text {
                flex: 1 1;
                white-space: nowrap;
                text-overflow: ellipsis;
                overflow: hidden;
            }
            footer {
                justify-self: flex-start;
                display: flex;
                align-items: center;
                height: 3%;
                min-height: 1.2em;
                max-height: 70px;
                justify-content: center;
                background: #2d3036;
                color: white;
            }
            .pre {
                white-space: pre;
            }
            table-charter-intro {
                flex: 1 1;
                overflow: auto;
                margin: 5px;
            }
        </style>
      <script type="module" crossorigin src="/table_charter/assets/index-CwwjOzko.js"></script>
      <link rel="stylesheet" crossorigin href="/table_charter/assets/index-C41jh4pC.css">
    </head>
    <body>
        <section>
            <header>
                <img id="logo" />
                <div id="title-text"></div>
                <div id="lang_select">
                    <span>🌍</span>
                    <select id="lang-select-select">
                        <option>en</option>
                        <option>de</option>
                    </select>
                </div>
            </header>
            <table-charter-intro></table-charter-intro>
            <footer>
                <a class="pre">Made with </a>
                <a
                    href="https://gitlab.com/urswilke/table_charter"
                    title="Code repository"
                    >table_charter</a
                >
            </footer>
            <!-- made from commit 7b106468cd777e90e2ad7698ebdb8e5f3362ee9a of https://gitlab.com/urswilke/table_charter -->
            <script id="load-example-data">
                // The following sets the attribute data in the table-charter-intro element to the content of the file
                // https://gitlab.com/urswilke/table_charter/-/blob/main/src/example_tablebook_sample.json
                // instead, you could also write:
                // <table-charter-intro data='--put-the-data-here--' />
                // instead of the above definition of the <table-charter-intro> element...:
                (async function () {
                    const response = await fetch(
                        "https://gitlab.com/api/v4/projects/45687298/repository/files/src%2Fexample_tablebook_sample.json/raw",
                    );
                    const data = await response.text();
                    document
                        .querySelector("table-charter-intro")
                        .setAttribute("data", data);
                })();
            </script>
            <script id="project-data">
                const project_data = {
                    logo_base64: "",
                    logo_url:
                        "https://gitlab.com/urswilke/table_charter/-/raw/main/img/logo_small.svg",
                    title: "Dashboard demo of example table book",
                    date: "2024-5-18",
                };
            </script>
            <script>
                const logo =
                    project_data.logo_base64 !== ""
                        ? "data:image/png;base64, " +
                          project_data.logo_base64
                        : project_data.logo_url;
                document.getElementById("logo").src = logo;

                const browser_language =
                    navigator.language.replace(/-.*/, "") || "en";

                // write the project title with the date in the format specified by the language:
                function update_title(browser_language) {
                    let date = new Intl.DateTimeFormat(browser_language, {
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                    }).format(new Date(project_data.date));
                    document.getElementById("title-text").innerHTML =
                        project_data.title + " - " + date;
                }
                update_title(browser_language);

                let element = document.getElementById("lang-select-select");
                element.value = browser_language;

                var selected_language = document.getElementById(
                    "lang-select-select",
                );
                selected_language.addEventListener(
                    "change",
                    function () {
                        document.querySelector("table-charter-intro").language =
                            this.value;
                        update_title(this.value);
                    },
                    false,
                );
            </script>
        </section>
    </body>
</html>
