<!doctype html>
<!-- TODO: get lang from table book data! -->
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="dark light" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>table charter</title>
        <!-- define favicon here:-->
        <link
            rel="icon"
            type="image/svg"
            href="img/table_charter_favicon.svg"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/2.9.3/introjs.css"
        />
        <script type="module" src="./src/index.js"></script>
        <style>
            body {
                font-family: system-ui, sans-serif;
            }

            * {
                margin: 0px;
                padding: 0px;
            }

            img {
                height: 72%;
                margin-left: 7px;
                border: white solid 1px;
                border-radius: 4px;
            }
            #lang_select {
                margin-right: 15px;
                display: flex;
                gap: 5px;
            }

            /* see 2nd example here: https://stackoverflow.com/questions/25098042/fill-remaining-vertical-space-with-css-using-displayflex/25098486#25098486 */
            section {
                display: flex;
                flex-flow: column;
                height: 100vh;
            }
            header {
                display: flex;
                flex-direction: row;
                justify-self: flex-start;
                justify-content: space-between;
                align-items: center;
                text-align: center;
                background: #5e677b;
                color: white;
                margin: 0px;
                font-size: 20px;
                width: 100%;
                height: 5%;
                min-height: 1.2em;
                max-height: 70px;
            }
            #title-text {
                flex: 1 1;
                white-space: nowrap;
                text-overflow: ellipsis;
                overflow: hidden;
            }
            footer {
                justify-self: flex-start;
                display: flex;
                align-items: center;
                height: 3%;
                min-height: 1.2em;
                max-height: 70px;
                justify-content: center;
                background: #2d3036;
                color: white;
            }
            .pre {
                white-space: pre;
            }
            table-charter-intro {
                flex: 1 1;
                overflow: auto;
                margin: 5px;
            }
            /* needed for dark mode (because then, the font is white on white otherwise) */
            .introjs-tooltip {
                color: black;
                width: 60vw;
            }
            .introjs-tooltip-header {
                display: flex;
                flex-flow: row;
                align-items: flex-start;
                align-content: flex-start;
                margin-bottom: 10px;
            }
            .introjs-helperLayer {
                opacity: 0.5 !important;
            }
            ul {
                margin-left: 20px;
            }
            .introjs-dontShowAgain {
                margin-top: 25px;
            }
            label[for="introjs-dontShowAgain"] {
                color: grey;
            }
            input#introjs-dontShowAgain {
                margin-right: 10px;
            }
            /* https://github.com/usablica/intro.js/issues/1202#issuecomment-1647264044 */
            .introjs-overlay {
                pointer-events: none;
            }
            .introjs-helperLayer {
                pointer-events: none;
            }
            .introjs-skipbutton {
                margin-left: auto;
                order: 2;
                border-radius: 8px;
                border: solid red;
                font-size: 30px;
            }
            .introjs-skipbutton:hover {
                opacity: 0.5;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <section>
            <header>
                <img id="logo" />
                <div id="title-text"></div>
                <div id="lang_select">
                    <span>🌍</span>
                    <select id="lang-select-select">
                        <option>en</option>
                        <option>de</option>
                    </select>
                </div>
            </header>
            <table-charter-intro></table-charter-intro>
            <footer>
                <a class="pre">Made with </a>
                <a
                    href="https://gitlab.com/urswilke/table_charter"
                    title="Code repository"
                    >table_charter</a
                >
            </footer>
            <script>
                // The following sets the attribute data in the table-charter-intro element to the content of the file
                // https://gitlab.com/urswilke/table_charter/-/blob/main/src/example_compressed.json
                // instead, you could also write:
                // <table-charter-intro data='--put-the-data-here--' />
                // instead of the above definition of the <table-charter-intro> element...:
                (async function () {
                    const response = await fetch(
                        "https://gitlab.com/api/v4/projects/45687298/repository/files/src%2Fexample_tablebook_sample.json/raw",
                        // "https://gitlab.com/api/v4/projects/57193066/repository/files/example_tablebook.json/raw",
                    );
                    const data = await response.text();
                    document
                        .querySelector("table-charter-intro")
                        .setAttribute("data", data);
                })();

                const project_data = {
                    client_logo_base64: "",
                    client_logo_url:
                        "https://gitlab.com/urswilke/table_charter/-/raw/main/img/logo_small.svg",
                    project_name: "Dashboard demo of example table book",
                    date: "2024-5-18",
                };
                const logo =
                    project_data.client_logo_base64 !== ""
                        ? "data:image/png;base64, " +
                          project_data.client_logo_base64
                        : project_data.client_logo_url;
                document.getElementById("logo").src = logo;

                const browser_language =
                    navigator.language.replace(/-.*/, "") || "en";

                // write the project title with the date in the format specified by the language:
                function update_title(browser_language) {
                    let date = new Intl.DateTimeFormat(browser_language, {
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                    }).format(new Date(project_data.date));
                    document.getElementById("title-text").innerHTML =
                        project_data.project_name + " - " + date;
                }
                update_title(browser_language);

                let element = document.getElementById("lang-select-select");
                element.value = browser_language;

                var selected_language = document.getElementById(
                    "lang-select-select",
                );
                selected_language.addEventListener(
                    "change",
                    function () {
                        document.querySelector("table-charter-intro").language =
                            this.value;
                        update_title(this.value);
                    },
                    false,
                );
            </script>
        </section>
    </body>
</html>
