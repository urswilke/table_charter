<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="dark light" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>table charter</title>
        <link rel="icon" href="./favicon.ico" type="image/x-icon" />
        <script type="module">
            import { TableCharter } from "https://unpkg.com/table_charter/dist/main.es.js";
        </script>
        <style>
            body {
                font-family: system-ui, sans-serif;
            }
            section {
                display: flex;
                flex-direction: column;
                height: 95vh;
            }
            table-charter {
                flex: 1 1;
                overflow: auto;
                margin: 5px;
            }
        </style>
    </head>
    <body>
        <section>
            <table-charter></table-charter>
        </section>
        <script id="load-example-data">
            // The following sets the attribute data in the table-charter element to the content of the file
            // https://raw.githubusercontent.com/urswilke/table_charter/refs/heads/main/src/example_tablebook_sample.json
            // instead, you could also write:
            // <table-charter data='--put-the-data-here--' />
            // instead of the above definition of the <table-charter> element...:
            (async function () {
                const response = await fetch(
                    "https://raw.githubusercontent.com/urswilke/table_charter/refs/heads/main/src/example_tablebook_sample.json"
                );
                const data = await response.text();
                document.querySelector("table-charter").setAttribute("data", data)
            })();
        </script>
    </body>
</html>
