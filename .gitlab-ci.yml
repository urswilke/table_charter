# from here: https://gitlab.com/bar_foo/wdio-cucumber-typescript/-/blob/master/.gitlab-ci.yml?ref_type=heads
cache:
  paths:
    - node_modules/
# TODO: find new docker image!
# (deprecated: https://registry.hub.docker.com/r/atools/firefox-headless)
# I assume we need a new one with a newer firefox version (locally with version 126.0 it works)
# and on gitlab ci also 2 of 3 tests succeed
# (cf. https://gitlab.com/urswilke/table_charter/-/jobs/7105218645)
run_test_firefox:
  image: 
    name: selenium/node-firefox
    # see here:
    # https://stackoverflow.com/questions/56579468/list-directory-var-lib-apt-lists-partial-is-missing-acquire-20-not-a-direc/57930100#57930100
    # https://forum.gitlab.com/t/gitlab-ci-yaml-use-image-with-a-specific-user/72854/5
    docker:
      user: root
  script:
    - apt-get update
    - apt-get -y install libasound2
    # - firefox --version
    - node -v
    - npm install
    - npm run test -- --firefox
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

run_test_chrome:
  image: atools/chrome-headless:java17-nodelts-latest
  script:
    - google-chrome --version
    - node -v
    - npm install
    - npm run test -- --chrome
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  image: node:20.11.0
  script:
    - npm install
    - npm run build
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
