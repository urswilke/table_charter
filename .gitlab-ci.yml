# from here: https://gitlab.com/bar_foo/wdio-cucumber-typescript/-/blob/master/.gitlab-ci.yml?ref_type=heads
cache:
  paths:
    - node_modules/

run_test_firefox:
  image: atools/firefox-headless:java17-nodelts-latest
  script:
    - apt-get update
    - apt-get -y install libasound2
    - firefox --version
    - node -v
    - npm install
    - npm run test -- --firefox
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

run_test_chrome:
  image: atools/chrome-headless:java17-nodelts-latest
  script:
    - google-chrome --version
    - node -v
    - npm install
    - npm run test -- --chrome
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  image: node:20.11.0
  script:
    - npm install
    - npm run build
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
