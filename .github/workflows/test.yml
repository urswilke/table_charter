name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: ⬇️ Checkout Code
          uses: actions/checkout@v4

        - name: 🐢 Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: 🏗️ Install Dependencies
          run: npm install

        - name: 🧪 Test
          run: npm run test -- --firefox

        - name: 🧪 Test on chrome
          run: npm run test -- --chrome

